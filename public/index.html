<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101612">
    <title>QuietCall</title>
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="card">
      <div class="brand"><span class="brand-mark" aria-hidden="true">●</span> quietcall</div>
      <h1>Clear voice. Simple call.</h1>
      <p class="subhead">One-to-one voice calls. No account needed.</p>

      <section id="home" class="panel" hidden>
        <button id="create" class="primary">Create a call</button>
        <p id="home-error" class="detail" role="status" aria-live="polite"></p>
      </section>

      <section id="call" class="panel" hidden>
        <p id="status" class="status" role="status" aria-live="polite">Preparing call…</p>
        <p id="detail" class="detail"></p>
        <p id="remote-mute" class="detail remote-mute" role="status" aria-live="polite" hidden></p>
        <div id="invite" class="invite" hidden>
          <button id="copy" class="secondary">Copy invite link</button>
        </div>
        <label id="audio-output-control" class="audio-output" hidden>
          Audio output
          <select id="audio-output" class="secondary"></select>
        </label>
        <p id="audio-output-note" class="detail" hidden></p>
        <div class="controls">
          <button id="join" class="primary" hidden>Join call</button>
          <button id="mute" class="secondary" hidden>Mute</button>
          <button id="hangup" class="danger" hidden>Hang up</button>
          <button id="new-call" class="primary" hidden>New call</button>
        </div>
        <details id="diagnostics" class="diagnostics">
          <summary>Connection diagnostics</summary>
          <div class="diagnostic-actions">
            <button id="check-service" class="secondary">Check service</button>
            <button id="copy-diagnostics" class="secondary">Copy report</button>
          </div>
          <pre id="diagnostic-report" aria-live="polite"></pre>
        </details>
      </section>
      <audio id="remote-audio" autoplay playsinline></audio>
      <p class="footnote">Audio travels directly between callers when possible.</p>
    </main>
  </body>
</html>
