<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111816">
    <meta name="description" content="QuietCall makes simple, private one-to-one voice calls.">
    <title>QuietCall — clear voice, simple call</title>
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to call controls</a>
    <main class="app-shell" id="main-content" tabindex="-1">
      <section id="home" class="home-panel" hidden>
        <div class="home-copy">
          <h1>Clear voice.<br>Simple call.</h1>
          <p class="subhead">A simple audio line for two people. No account. No video.</p>
          <button id="create" class="primary create-button">
            Create a call
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <p id="home-error" class="detail home-error" role="status" aria-live="polite"></p>
        </div>

        <aside class="home-visual" aria-hidden="true">
          <div class="voice-line">
            <span class="voice-node"><span class="wave-bars"><i></i><i></i><i></i><i></i><i></i></span></span>
            <span class="voice-connector"></span>
            <span class="voice-node voice-node-guest"><span class="wave-bars"><i></i><i></i><i></i><i></i><i></i></span></span>
          </div>
        </aside>
      </section>

      <section id="call" class="call-panel" hidden>
        <div class="call-heading">
          <div>
            <p class="eyebrow">YOUR CALL</p>
            <h1>Voice call</h1>
          </div>
          <div class="connection-chip">
            <span class="connection-indicator" aria-hidden="true"></span>
            <p id="status" class="status" role="status" aria-live="polite">Preparing call…</p>
          </div>
        </div>
        <p id="detail" class="detail call-detail"></p>
        <p id="foreground-hint" class="foreground-hint" role="status" aria-live="polite" hidden></p>

        <section class="call-stage" aria-label="Call participants">
          <article class="participant participant-you">
            <span class="participant-tag">YOU</span>
            <div class="participant-orb" aria-hidden="true"><span class="wave-bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div>
            <div class="participant-name"><strong>You</strong><span>This device</span></div>
          </article>
          <article class="participant participant-guest">
            <span class="participant-tag">INVITEE</span>
            <div class="participant-orb guest-orb" aria-hidden="true"><span class="wave-bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div>
            <div class="participant-name"><strong>Other caller</strong><span>Voice connection</span></div>
          </article>
        </section>

        <div id="invite" class="invite" hidden>
          <div class="invite-copy"><span class="invite-label">CALL LINK</span><span class="invite-help">Share with one person</span></div>
          <button id="copy" class="secondary">Copy invite link</button>
        </div>

        <div class="controls">
          <button id="join" class="primary" hidden>Join call</button>
          <button id="mute" class="secondary" hidden>Mute</button>
          <button id="hangup" class="danger" hidden>
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M4 15.5c4.8-4 11.2-4 16 0l-2.1 3.1a1.5 1.5 0 0 1-1.8.5l-2.3-1a1.5 1.5 0 0 1-.9-1.4v-1.1a13 13 0 0 0-1.8-.1 13 13 0 0 0-1.8.1v1.1a1.5 1.5 0 0 1-.9 1.4l-2.3 1a1.5 1.5 0 0 1-1.8-.5L4 15.5Z" fill="currentColor"/></svg>
            Hang up
          </button>
          <button id="new-call" class="primary" hidden>New call</button>
        </div>

        <details id="diagnostics" class="diagnostics">
          <summary>Connection diagnostics</summary>
          <div class="diagnostic-actions">
            <button id="check-service" class="secondary">Check service</button>
            <button id="copy-diagnostics" class="secondary">Copy report</button>
          </div>
          <pre id="diagnostic-report" aria-live="polite"></pre>
        </details>
      </section>
      <audio id="remote-audio" autoplay playsinline></audio>
    </main>
  </body>
</html>
